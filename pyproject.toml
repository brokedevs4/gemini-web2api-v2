[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "gemini-web2api"
version = "2.0.0"
description = "Gemini Web to OpenAI & Gemini API proxy (Gemini 4 Hydrogen & Argon update)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27.0",
]

[project.optional-dependencies]
image = ["Pillow>=10.0.0"]

[project.scripts]
gemini-web2api = "gemini_web2api.__main__:main"
